<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./netflix.css">
    <title>Document</title>
</head>
<body>
    <header class="main-header">
           <a class="header-content" href="">
            <img class="gift-icon" src="./netfliximgs/gift (2)-recolored.png" alt="">
            <p class="header-text">New to Netflix?Try 14 days for ₦0.</p>
           </a>
    </header>
    <div class="top-flex">
        <img class="netflix-logo" src="./netfliximgs/imgi_1_AAAAAZge2REfWoSoWRs31izjUdgihldMUslSHTdfz-1aT4vVrgJuVByU92G8wIrBkwULJHWjM1khpzW0xWndigQFYViKFpy-pM6NZFnTKEPkpf9hcdSzCyzqBbcouyIpmgVLbodhaeyqCXaS.svg" alt="">
        <button class="signin-button">
            <span>Sign In</span>
        </button>
    </div>
    <div class="section1">
        <h1 class="section1-h1">Unlimited movies, TV 
            <br>shows, and more</h1>
        <p class="section1-price">Plans start at ₦2,500. Cancel anytime.</p>
        <h3 class="section1-h3">Ready to watch? Enter your email to start your membership.</h3>
        <div class="section1-inputs">
            <input class="section1-email" type="email" placeholder="Email address">
            <button class="section1-button">
               <div class="section1-button-content">
                <span>Try 14 days for ₦0</span>
                <img class="section1-arrow" src="./netfliximgs/arrow.png" alt="">
               </div>
            </button>
        </div>
        <p class="section1-footer">New members only. Terms below.</p>
    </div>
</body>
</html>
